services:
  # ── Apache Cassandra 4.1 ──────────────────────────────────────────────────
  cassandra:
    image: cassandra:4.1
    container_name: audit_cassandra
    ports:
      - "9042:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=AuditCluster
      - CASSANDRA_DC=dc1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - HEAP_NEWSIZE=256M
      - MAX_HEAP_SIZE=1024M
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  # ── FastAPI Application ───────────────────────────────────────────────────
  app:
    build: .
    container_name: audit_app
    ports:
      - "8000:8000"
    environment:
      - CASSANDRA_HOST=cassandra
      - CASSANDRA_PORT=9042
      - CASSANDRA_DC=dc1
    volumes:
      - .:/app        
    depends_on:
      cassandra:
        condition: service_healthy
    restart: unless-stopped

volumes:
  cassandra_data:
    driver: local
